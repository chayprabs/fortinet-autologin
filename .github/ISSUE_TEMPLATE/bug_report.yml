name: Bug report
description: fortiauto isn't logging in, crashed, or misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste your password. Check the [troubleshooting guide](https://github.com/chayprabs/fortinet-autologin/blob/main/docs/troubleshooting.md) first."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `python -m fortiauto status` and `python -m fortiauto check`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Last ~30 lines of fortiauto.log
      description: The path is shown by `status`. Remove anything personal.
      render: text
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
