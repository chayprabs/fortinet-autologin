name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + end-to-end tests (stdlib only, nothing to install)
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test without site-packages
        run: python -S -m fortiauto --help
      - name: Installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install-unix.sh
